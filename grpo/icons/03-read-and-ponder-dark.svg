<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" style="overflow:visible"><style>.it .s{fill:none;stroke:#F2EBDD;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
