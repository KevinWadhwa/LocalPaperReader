<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" style="overflow:visible"><style>.is .s{fill:none;stroke:#22252B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.is .p{fill:#FFFDF8;stroke:#22252B;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.is .t{fill:none;stroke:#22252B;stroke-width:calc(3 * .6px);stroke-linecap:round;opacity:.5}
.is .a{fill:none;stroke:#E0603A;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.is .hl{fill:none;stroke:#E0603A;stroke-width:calc(3 * 2.6px);stroke-linecap:round;opacity:.3;stroke-dasharray:1 1}
.is .h1{animation:ish1 calc(4.4s / 1.25) linear infinite}
.is .h2{animation:ish2 calc(4.4s / 1.25) linear infinite}
.is .mg{animation:ismg calc(4.4s / 1.25) ease-in-out infinite}
@keyframes ish1{0%,6%{stroke-dashoffset:1;opacity:.3}36%{stroke-dashoffset:0;opacity:.3}84%{stroke-dashoffset:0;opacity:.3}94%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes ish2{0%,46%{stroke-dashoffset:1;opacity:.3}76%{stroke-dashoffset:0;opacity:.3}84%{stroke-dashoffset:0;opacity:.3}94%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes ismg{0%,6%{transform:translate(36px,52px)}36%{transform:translate(76px,52px);animation-timing-function:ease-in-out}46%{transform:translate(36px,64px)}76%{transform:translate(80px,64px)}86%{transform:translate(80px,64px)}100%{transform:translate(36px,52px)}}</style>
<g class="is">
