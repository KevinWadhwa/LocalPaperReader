<path class="hl h2" pathLength="1" d="M34 64 H82"/>
<path class="s" d="M34 28 H60"/>
<path class="t" d="M34 40 H82"/><path class="t" d="M34 52 H76"/><path class="t" d="M34 64 H82"/><path class="t" d="M34 76 H70"/><path class="t" d="M34 88 H78"/>
<g class="mg">
<path class="s" d="M10 10 L24 24" style="stroke-width:calc(3 * 2.2px)"/>
