<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240" style="overflow:visible"><style>.is .s{fill:none;stroke:#F2EBDD;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.is .p{fill:#24272D;stroke:#F2EBDD;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.is .t{fill:none;stroke:#F2EBDD;stroke-width:calc(3 * .6px);stroke-linecap:round;opacity:.5}
.is .a{fill:none;stroke:#EE7A52;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.is .hl{fill:none;stroke:#EE7A52;stroke-width:calc(3 * 2.6px);stroke-linecap:round;opacity:.3;stroke-dasharray:1 1}
.is .h1{animation:ish1 calc(4.4s / 1.25) linear infinite}
.is .h2{animation:ish2 calc(4.4s / 1.25) linear infinite}
.is .mg{animation:ismg calc(4.4s / 1.25) ease-in-out infinite}
@keyframes ish1{0%,6%{stroke-dashoffset:1;opacity:.3}36%{stroke-dashoffset:0;opacity:.3}84%{stroke-dashoffset:0;opacity:.3}94%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes ish2{0%,46%{stroke-dashoffset:1;opacity:.3}76%{stroke-dashoffset:0;opacity:.3}84%{stroke-dashoffset:0;opacity:.3}94%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes ismg{0%,6%{transform:translate(36px,52px)}36%{transform:translate(76px,52px);animation-timing-function:ease-in-out}46%{transform:translate(36px,64px)}76%{transform:translate(80px,64px)}86%{transform:translate(80px,64px)}100%{transform:translate(36px,52px)}}
.it .s{fill:none;stroke:#F2EBDD;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.it .p{fill:#24272D;stroke:#F2EBDD;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.it .t{fill:none;stroke:#F2EBDD;stroke-width:calc(3 * .6px);stroke-linecap:round;opacity:.5}
.it .a{fill:none;stroke:#EE7A52;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.it .D{animation-duration:3.52s;animation-iteration-count:infinite;animation-fill-mode:both}
.it .ey{animation-name:itey;animation-timing-function:ease-in-out}
.it .hd{transform-origin:50px 82px;animation-name:ithd;animation-timing-function:ease-in-out}
.it .br{transform-origin:58px 49px;animation-name:itbr;animation-timing-function:ease-in-out}
.it .mr{animation-name:itmr}.it .mt{animation-name:itmt}
.it .bb{transform-box:fill-box;transform-origin:center;animation-timing-function:cubic-bezier(.3,1.6,.5,1)}
.it .b1{animation-name:itb1}.it .b2{animation-name:itb2}.it .b3{animation-name:itb3}
@keyframes itey{0%{transform:translate(-3px,1px)}16.9%{transform:translate(3px,1px)}20.6%{transform:translate(-3px,2.5px)}37.3%{transform:translate(3px,2.5px)}46.9%,87.9%{transform:translate(2.5px,-3.5px)}100%{transform:translate(-3px,1px)}}
@keyframes ithd{0%,39.7%{transform:rotate(0)}49.3%,87.9%{transform:rotate(-5deg)}100%{transform:rotate(0)}}
@keyframes itbr{0%,42.1%{transform:translateY(0) rotate(0)}49.3%,87.9%{transform:translateY(-3px) rotate(-8deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes itmr{0%,42.1%{opacity:1}46.9%,87.9%{opacity:0}95.2%,100%{opacity:1}}
@keyframes itmt{0%,42.1%{opacity:0}46.9%,87.9%{opacity:1}95.2%,100%{opacity:0}}
@keyframes itb1{0%,49.3%{opacity:0;transform:scale(.3)}55.4%,85.5%{opacity:1;transform:scale(1)}92.8%,100%{opacity:0;transform:scale(1)}}
@keyframes itb2{0%,56.6%{opacity:0;transform:scale(.3)}62.6%,85.5%{opacity:1;transform:scale(1)}92.8%,100%{opacity:0;transform:scale(1)}}
@keyframes itb3{0%,63.8%{opacity:0;transform:scale(.3)}71%,85.5%{opacity:1;transform:scale(1)}92.8%,100%{opacity:0;transform:scale(1)}}
.sw2{animation:sw2 7.04s step-end infinite}
.sw3{animation:sw3 7.04s step-end infinite}
@keyframes sw2{0%{opacity:1}50%,100%{opacity:0}}
@keyframes sw3{0%{opacity:0}50%,100%{opacity:1}}</style>
